# Nginx configuration for Malayalam University React Frontend (SPA)
# Place or include this in your server block (e.g. /etc/nginx/sites-available/malayalamuniversity.edu.in)

server {
    listen 80;
    listen [::]:80;
    server_name malayalamuniversity.edu.in www.malayalamuniversity.edu.in;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name malayalamuniversity.edu.in www.malayalamuniversity.edu.in;

    # SSL Certificate Paths (managed by Certbot or custom SSL)
    # ssl_certificate /etc/letsencrypt/live/malayalamuniversity.edu.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/malayalamuniversity.edu.in/privkey.pem;

    # Path to your built React production dist directory
    root /var/www/mu-react/dist; # Update with your actual deployment path
    index index.html;

    # Charset
    charset utf-8;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 1. SPA Fallback Routing (Solves the 404 on reload!)
    # First attempt to serve request as a file, then as a directory,
    # then fall back to /index.html so React Router handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Immutable Cache for Vite Hashed Production Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Static Media and Font Caching
    location ~* \.(ico|png|jpg|jpeg|webp|svg|gif|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # 4. Never Cache index.html (Ensures instant deployment updates for visitors)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 5. Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

